<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="fig" data-figure="spot-the-line">
  <title>Spot the line</title>
  <rect x="20" y="20" width="600" height="210" class="fig-paper fig-line-stroke" fill="#ffffff" stroke="#8b8ba3" rx="8" stroke-width="2" />
  <rect x="20" y="20" width="600" height="34" class="fig-code" fill="#f2f2f4" stroke="none" rx="8" />
  <text x="36" y="42" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold">Where each program is sending data</text>
  <text x="604" y="42" font-size="13" text-anchor="end" class="fig-muted" fill="#55556a">Sample</text>
  <text x="56" y="82" font-size="13" text-anchor="start" class="fig-muted" fill="#55556a">Program</text>
  <text x="220" y="82" font-size="13" text-anchor="start" class="fig-muted" fill="#55556a">Sending to</text>
  <text x="36" y="117" font-size="13" text-anchor="start" class="fig-muted" fill="#55556a">1</text>
  <text x="56" y="117" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">Chat app</text>
  <text x="220" y="117" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">backroom</text>
  <text x="36" y="161" font-size="13" text-anchor="start" class="fig-muted" fill="#55556a">2</text>
  <text x="56" y="161" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">Printer app</text>
  <text x="220" y="161" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">printer</text>
  <rect x="28" y="180" width="584" height="38" class="fig-soft" fill="#dbe6ff" stroke="none" rx="4" />
  <text x="36" y="205" font-size="13" text-anchor="start" class="fig-muted" fill="#55556a">3</text>
  <text x="56" y="205" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">Chat app</text>
  <text x="220" y="205" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold">a company's computers, far away</text>
  <text x="20" y="268" font-size="15" text-anchor="start" class="fig-ink fig-result" fill="#1c1c28" font-weight="bold">That one. Her letter is going somewhere she doesn't own, and nothing beeped.</text>
</svg>
