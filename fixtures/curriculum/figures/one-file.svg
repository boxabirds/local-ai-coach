<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 290" width="640" height="290" font-family="system-ui, -apple-system, Segoe UI, sans-serif" class="fig" data-figure="one-file">
  <title>One file, nothing to call</title>
  <defs>
    <pattern id="one-file-over" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" class="fig-ink-stroke" stroke="#1c1c28" stroke-width="3" />
    </pattern>
  </defs>
  <path d="M40 30 h70 l20 20 v70 h-90 z" class="fig-accent-fill" fill="#1d4ed8" />
  <text x="85" y="92" font-size="13" text-anchor="middle" class="fig-on-accent" fill="#ffffff" font-weight="bold">5 GB</text>
  <text x="150" y="60" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">One model file. No account, no key,</text>
  <text x="150" y="82" font-size="15" text-anchor="start" class="fig-ink" fill="#1c1c28">nothing else to call.</text>
  <text x="150" y="112" font-size="13" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold" data-when="machine=box">Copied to: Priya's box</text>
  <text x="150" y="112" font-size="13" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold" data-when="machine=old">Copied to: An old laptop</text>
  <text x="150" y="112" font-size="13" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold" data-when="machine=desktop">Copied to: A desktop</text>
  <rect x="40" y="176" width="440" height="40" class="fig-paper fig-ink-stroke" fill="#ffffff" stroke="#1c1c28" rx="4" stroke-width="2" />
  <line x1="260" y1="168" x2="260" y2="224" class="fig-ink-stroke" stroke="#1c1c28" stroke-dasharray="3 3" stroke-width="1.5" />
  <text x="260" y="240" font-size="13" text-anchor="middle" class="fig-muted" fill="#55556a">half</text>
  <text x="40" y="164" font-size="13" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold" data-when="machine=box">Its memory: 16 GB</text>
  <text x="40" y="164" font-size="13" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold" data-when="machine=old">Its memory: 4 GB</text>
  <text x="40" y="164" font-size="13" text-anchor="start" class="fig-ink" fill="#1c1c28" font-weight="bold" data-when="machine=desktop">Its memory: 32 GB</text>
  <g data-when="machine=box">
    <rect x="40" y="182" width="137.5" height="28" class="fig-accent-fill" fill="#1d4ed8" stroke="none" rx="3" />
  </g>
  <text x="40" y="276" font-size="15" text-anchor="start" class="fig-ink fig-result" fill="#1c1c28" data-verdict="fits" font-weight="bold" data-when="machine=box">Fits: 5 GB is under half of 16 GB.</text>
  <g data-when="machine=old">
    <rect x="40" y="182" width="440" height="28" class="fig-accent-fill" fill="#1d4ed8" stroke="none" rx="3" />
    <rect x="480" y="182" width="110" height="28" class="fig-ink-stroke" fill="url(#one-file-over)" stroke="#1c1c28" stroke-dasharray="4 3" />
    <text x="486" y="176" font-size="13" text-anchor="start" class="fig-muted" fill="#55556a">no room</text>
  </g>
  <text x="40" y="276" font-size="15" text-anchor="start" class="fig-ink fig-result" fill="#1c1c28" data-verdict="no" font-weight="bold" data-when="machine=old">Doesn't fit: 5 GB is bigger than 4 GB.</text>
  <g data-when="machine=desktop">
    <rect x="40" y="182" width="68.75" height="28" class="fig-accent-fill" fill="#1d4ed8" stroke="none" rx="3" />
  </g>
  <text x="40" y="276" font-size="15" text-anchor="start" class="fig-ink fig-result" fill="#1c1c28" data-verdict="fits" font-weight="bold" data-when="machine=desktop">Fits: 5 GB is under half of 32 GB.</text>
</svg>
