name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main
  schedule:
    - cron: "0 0 * * *" # Run daily at midnight UTC

permissions:
  contents: read

jobs:
  smoke:
    name: Smoke / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The coach runs on macOS and Linux only.
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js (for pnpm; Bun comes from the lockfile)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies (monorepo)
        run: pnpm install

      - name: Build all apps
        run: pnpm build

      - name: Test the coach's server starts
        run: |
          pnpm --filter @repo/app start &
          SERVER_PID=$!
          started=false
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then started=true; break; fi
            sleep 1
          done
          kill $SERVER_PID 2>/dev/null || true
          wait $SERVER_PID 2>/dev/null || true
          [ "$started" = true ] || { echo "The coach's server did not start within 30 seconds"; exit 1; }
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Install dependencies
        run: pnpm install

      - name: Run linting
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  agent-tests:
    name: Agent tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install uv
        run: pip install uv

      - name: Sync agent dependencies
        working-directory: apps/agent
        run: uv sync

      - name: Run pytest
        working-directory: apps/agent
        run: uv run pytest -q

  notify-slack:
    name: Notify Slack on Failure
    runs-on: ubuntu-latest
    needs: [smoke, lint, agent-tests]
    if: |
      failure() &&
      github.event_name == 'schedule'
    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@b0fa283ad8fea605de13dc3f449259339835fc52 # v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":warning: *Smoke test failed for `with-langgraph-python` :warning:.*",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":warning: *Smoke test failed for <https://github.com/copilotkit/with-langgraph-python|with-langgraph-python> :warning:*\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run details>"
                  }
                }
              ]
            }
